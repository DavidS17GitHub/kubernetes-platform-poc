apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queue-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DavidS17GitHub/kubernetes-platform-poc.git
    targetRevision: main
    path: apps/queue-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: queue-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
