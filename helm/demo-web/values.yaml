replicaCount: 3

image:
  repository: nginx
  tag: "1.28-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

content: |
  <html>
    <body>
      <h1>Kubernetes Helm Deployment</h1>
      <p>Stage 3 - Helm Upgrade</p>
    </body>
  </html>

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 20
