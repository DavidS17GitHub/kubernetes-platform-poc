apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-keda
  namespace: queue-demo
type: Opaque
stringData:
  host: amqp://rabbitmq.queue-demo.svc.cluster.local:5672/

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
  namespace: queue-demo
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-keda
      key: host

    - parameter: username
      name: rabbitmq-credentials
      key: username

    - parameter: password
      name: rabbitmq-credentials
      key: password

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-worker
  namespace: queue-demo
spec:
  scaleTargetRef:
    name: queue-worker

  minReplicaCount: 0
  maxReplicaCount: 5

  pollingInterval: 10
  cooldownPeriod: 30

  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: jobs
        mode: QueueLength
        value: "5"

      authenticationRef:
        name: rabbitmq-auth
