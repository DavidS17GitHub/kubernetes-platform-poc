apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: queue-demo
spec:
  replicas: 0

  selector:
    matchLabels:
      app: queue-worker

  template:
    metadata:
      labels:
        app: queue-worker

    spec:
      containers:
        - name: worker
          image: curlimages/curl:latest

          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username

            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password

          command:
            - /bin/sh
            - -c

          args:
            - |
              while true; do
                curl -s \
                  -u "$RABBITMQ_USER:$RABBITMQ_PASS" \
                  -H "content-type: application/json" \
                  -X POST \
                  -d '{"count":1,"ackmode":"ack_requeue_false","encoding":"auto","truncate":50000}' \
                  http://rabbitmq:15672/api/queues/%2F/jobs/get

                echo
                sleep 5
              done
